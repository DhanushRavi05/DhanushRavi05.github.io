<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Certificate — Owner Tool</title>
<style>
  body{background:#0F1B24;color:#EDEEF0;font-family:'Segoe UI',sans-serif;max-width:560px;margin:60px auto;padding:0 24px;}
  h1{font-size:22px;margin-bottom:6px;}
  p.note{color:#8CA0A8;font-size:14px;margin-bottom:28px;}
  label{display:block;font-size:13px;color:#8CA0A8;margin:16px 0 6px;}
  input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid rgba(63,184,175,0.3);background:#142530;color:#EDEEF0;font-size:14px;}
  button{margin-top:22px;background:#3FB8AF;color:#0F1B24;border:none;padding:12px 20px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px;}
  pre{margin-top:24px;background:#182C38;border:1px solid rgba(63,184,175,0.3);border-radius:8px;padding:16px;font-size:13px;overflow-x:auto;white-space:pre-wrap;color:#3FB8AF;}
  .copybtn{margin-top:10px;background:none;border:1px solid rgba(63,184,175,0.4);color:#EDEEF0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;}
</style>
</head>
<body>
  <h1>Add a Certificate</h1>
  <p class="note">This is a local, offline tool — just for you. Fill the form, copy the generated code, and paste it inside the <code>window.CERTIFICATES = [ ... ]</code> array in <code>certificates.js</code>. Then push to GitHub — the live site updates for everyone who visits.</p>

  <label>Certificate Name</label>
  <input id="name" placeholder="e.g. Python for Everybody">

  <label>Issued By</label>
  <input id="issuer" placeholder="e.g. Coursera">

  <label>Year</label>
  <input id="year" placeholder="e.g. 2025">

  <label>Certificate / Verify Link (optional)</label>
  <input id="link" placeholder="https://...">

  <button onclick="generate()">Generate Code</button>

  <pre id="output" style="display:none;"></pre>
  <button class="copybtn" id="copyBtn" style="display:none;" onclick="copyCode()">Copy</button>

<script>
function generate(){
  const name = document.getElementById('name').value.trim() || "Certificate Name";
  const issuer = document.getElementById('issuer').value.trim() || "Issuer";
  const year = document.getElementById('year').value.trim() || "2026";
  const link = document.getElementById('link').value.trim();
  const code = `  { name: "${name}", issuer: "${issuer}", year: "${year}", link: "${link}" },`;
  const out = document.getElementById('output');
  out.textContent = code;
  out.style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
}
function copyCode(){
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text);
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'Copied!';
  setTimeout(()=>btn.textContent='Copy', 1500);
}
</script>
</body>
</html>
