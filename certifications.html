<nav>

    <div class="logo">dhanush<span>.r</span></div>
    <div class="navlinks" id="navlinks">
      <a href="index.html" data-nav>Home</a>

    <button class="navtoggle" id="navtoggle" aria-label="Toggle menu">&#9776;</button>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <div class="section-label">// 05</div>
    <h2>Certifications</h2>
    <div class="cert-group">
      <div class="cert-subhead">Courses Completed</div>
      <div class="cert-grid" id="certGridCourse"></div>
    </div>
    <div class="cert-group">
      <div class="cert-subhead">Internships</div>
      <div class="cert-grid" id="certGridIntern"></div>
    </div>

    <div class="owner-zone">
      <button id="ownerToggle" class="owner-link" type="button">Owner? Add a certificate</button>
      <div id="ownerPanel" class="owner-panel">
        <div id="keyGate">
          <label>Owner Key</label>
          <input type="password" id="ownerKey" placeholder="Paste your owner key">
          <button type="button" class="btn-owner" onclick="unlockOwner()">Unlock</button>
          <div class="owner-status" id="keyStatus"></div>
        </div>
        <div id="uploadForm" style="display:none;">
          <label>Certificate Name</label>
          <input id="certName" placeholder="e.g. Python for Everybody">
          <label>Issued By</label>
          <input id="certIssuer" placeholder="e.g. Coursera / Company Name">
          <label>Category</label>
          <select id="certCategory">
            <option value="course">Course Completed</option>
            <option value="internship">Internship</option>
          </select>
          <label>Year</label>
          <input id="certYear" placeholder="e.g. 2026">
          <label>Certificate Image or PDF</label>
          <input type="file" id="certFile" accept="image/*,.pdf">
          <button type="button" class="btn-owner" onclick="uploadCertificate()" id="uploadBtn">Upload Certificate</button>
          <div class="owner-status" id="uploadStatus"></div>
          <button type="button" class="owner-logout" onclick="ownerLogout()">Log out of owner mode on this device</button>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
